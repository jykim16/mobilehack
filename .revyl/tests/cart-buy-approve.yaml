# Check out one item in one tap and find it in Purchases.
test:
  metadata:
    name: cart-buy-approve
    platform: ios
    tags:
      - cart
      - checkout
      - smoke
  build:
    name: capy--org_01M7EXXJQYFBXQJNNW82GRTS5Z--mobilehack-ios
  variables:
    password: cart-e2e-demo-pass
  blocks:
    - type: code_execution
      step_description: |
        import uuid
        print(f"cart-e2e-{uuid.uuid4().hex[:10]}@example.com")
      code_execution_runtime: python
      variable_name: shopper_email
    - type: module_import
      module: "cart-sign-up"
    - type: instructions
      step_description: "Tap Checkout on the first item card."
    - type: validation
      step_description: "A message reading Ordered with a View in Purchases link appears, and the item card is no longer in the Cart."
    - type: instructions
      step_description: "Tap the Purchases tab in the bottom tab bar."
    - type: validation
      step_description: "The Purchases tab shows the purchased item with a delivery status line such as Order placed or Shipped."
