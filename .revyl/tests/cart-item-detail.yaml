# Open a cart item's detail sheet, scrub the price chart, and close it with the X button.
test:
  metadata:
    name: cart-item-detail
    platform: ios
    tags:
      - cart
      - details
  build:
    name: capy--org_01M7EXXJQYFBXQJNNW82GRTS5Z--mobilehack-ios
  variables:
    password: cart-e2e-demo-pass
  blocks:
    - type: code_execution
      step_description: |
        import uuid
        print(f"cart-e2e-{uuid.uuid4().hex[:10]}@example.com")
      code_execution_runtime: python
      variable_name: shopper_email
    - type: module_import
      module: "cart-sign-up"
    - type: instructions
      step_description: "Tap the product title of the first item card in the Cart tab."
    - type: validation
      step_description: "A full-screen item detail page shows the product image and title, then a Price history section with the current price and a line chart."
    - type: instructions
      step_description: "Touch and hold the middle of the price chart for about one second, then release."
    - type: instructions
      step_description: "Scroll down to the bottom of the page."
    - type: validation
      step_description: "The page shows a Reviews section with review rows and a See all link, and a Purchase details section with Subtotal, Estimated tax, Delivery, and Total."
    - type: validation
      step_description: "A Payment and delivery section shows a Visa logo with •••• 4242."
    - type: instructions
      step_description: "Tap the X button at the top left."
    - type: validation
      step_description: "The Cart tab is visible again with the item card and its Checkout button."
