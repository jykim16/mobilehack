# Create an account, sign out from Account, and sign back in with the same email and password.
test:
  metadata:
    name: cart-login
    platform: ios
    tags:
      - cart
      - auth
      - smoke
  build:
    name: capy--org_01M7EXXJQYFBXQJNNW82GRTS5Z--mobilehack-ios
  variables:
    password: cart-e2e-demo-pass
  blocks:
    - type: code_execution
      step_description: |
        import uuid
        print(f"cart-e2e-{uuid.uuid4().hex[:10]}@example.com")
      code_execution_runtime: python
      variable_name: shopper_email
    - type: instructions
      step_description: "On the Create your account screen, enter {{shopper_email}} as the email and {{password}} as the password, then tap Create account."
    - type: validation
      step_description: "The Cart screen is visible with a bottom tab bar showing Cart, Purchases, and Account."
    - type: instructions
      step_description: "Tap the Account tab in the bottom tab bar."
    - type: validation
      step_description: "The Account screen shows {{shopper_email}}."
    - type: instructions
      step_description: "Tap Sign out."
    - type: validation
      step_description: "The sign-in screen is visible with Email and Password fields."
    - type: instructions
      step_description: "Tap Already have an account? Sign in."
    - type: instructions
      step_description: "Enter {{shopper_email}} as the email and {{password}} as the password, then tap Sign in."
    - type: validation
      step_description: "The Cart screen is visible again with the Cart tab selected."
