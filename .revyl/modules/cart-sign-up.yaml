# Signs up a fresh shopper and loads the demo cart. Import with module_import "cart-sign-up".
# Expects test variables shopper_email and password.
blocks:
  - type: instructions
    step_description: "On the Create your account screen, enter {{shopper_email}} as the email and {{password}} as the password, then tap Create account."
  - type: validation
    step_description: "The Cart screen is visible with a bottom tab bar showing Cart, Purchases, and Account, and the Cart tab is selected."
  - type: if
    condition: "The cart shows Your cart is empty"
    then:
      - type: instructions
        step_description: "Tap Load demo cart."
      - type: manual
        step_type: wait
        step_description: "3"
  - type: validation
    step_description: "The Cart tab lists at least one item card with a product image, a price, a quantity stepper, and a Checkout button."
